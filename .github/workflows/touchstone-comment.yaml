name: Continuous Benchmarks (Comment)

concurrency:
  # head_ref is empty for workflow_run events, so group by the Receive run.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["Continuous Benchmarks (Receive)"]
    types:
      - completed

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  upload:
    runs-on: ubuntu-latest
    if: >
      ${{ github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - uses: CuiweiG/touchstone/actions/comment@08ffa6c473a81a3db6d8b1bda50ba1bdf03f5dec
        with: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
